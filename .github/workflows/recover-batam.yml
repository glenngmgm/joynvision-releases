# Keep asking Oracle for an ARM host until JoynVision has a server again.
#
# WHY THIS EXISTS AT ALL
# ----------------------
# Oracle disabled the Batam instance on 27 October 2026. It was terminated with
# its boot volume preserved, which released the Always Free allowance so a
# replacement could take its place, and Oracle then had no spare ARM hardware to
# put one on. a1-recover.sh on the owner's MacBook asks once a minute, but a
# closed lid sleeps that machine, and the small hours are exactly when a free
# host is most likely to appear. The owner would like the laptop to be allowed
# to sleep, so this has to stand on its own.
#
# WHY THIS REPOSITORY. joynvision-releases is public, so Actions minutes are
# unlimited. The private repo's 2,000 a month would not cover one long job.
#
# WHY FOUR LEGS AND NOT ONE JOB, WHICH IS THE WHOLE TRICK
# -------------------------------------------------------
# GitHub's scheduler cannot be relied on for anything frequent. The uptime check
# in this very repository is set to every ten minutes and its scheduled runs are
# a median of 229 minutes apart, worst case 378 - and this workflow was not
# started by the scheduler once in the first hour after it was added. A cron of
# */5 is a statement of intent, not a promise.
#
# A runner is killed at six hours, so one job cannot cover a day. But a workflow
# RUN may last days and each job inside it gets its own six hours. So this chains
# four legs of 350 minutes: ONE start from GitHub buys about 23 hours of
# continuous asking, and the scheduler only has to work roughly once a day
# rather than every five minutes.
#
# A leg that wins tells Telegram and disables this workflow, and every leg asks
# Oracle whether a server already exists before asking for one, so whichever of
# the four legs or the laptop wins, nothing else goes on creating machines.
#
# THE KEY. Unlike uptime.yml, which says in its own comments that it needs no
# secrets, this needs a key to the Oracle account in repository secrets. It is
# here deliberately and temporarily. DELETE THE OCI_* SECRETS once the server is
# back: a tenancy key should not outlive the outage it was added for.
name: Bring the Batam server back

on:
  schedule:
    # Not honoured as written, and not meant to be. It simply means a new run
    # starts as soon as GitHub is willing, and with four legs per run, roughly
    # once a day is enough.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      minutes_per_leg:
        description: Minutes each leg keeps asking (350 in earnest; set it low to prove the chain)
        type: string
        default: '350' 

# A CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER WAS GIVEN.
#
# This repository's default workflow token is read only. The leg needs
# actions:write, for the one thing it does on winning: switch this schedule off.
# Declared only in the leg, that was an escalation above the caller's inherited
# read, and every run died in seconds with startup_failure and no message in the
# API - including, silently, every scheduled one.
permissions:
  actions: write

# One run at a time, and a new one WAITS rather than killing the live one, so
# they hand over instead of overlapping.
concurrency:
  group: recover-batam
  cancel-in-progress: false

jobs:
  leg1:
    uses: ./.github/workflows/recover-batam-leg.yml
    secrets: inherit
    with:
      minutes: ${{ inputs.minutes_per_leg || '350' }}

  # !cancelled() rather than success(): a leg that errors should not end the
  # chain, because the next one would have asked anyway. Only a cancelled run,
  # which means somebody stopped it on purpose, stops the chain.
  leg2:
    needs: leg1
    if: ${{ !cancelled() && needs.leg1.outputs.won != 'yes' }}
    uses: ./.github/workflows/recover-batam-leg.yml
    secrets: inherit
    with:
      minutes: ${{ inputs.minutes_per_leg || '350' }}

  leg3:
    needs: leg2
    if: ${{ !cancelled() && needs.leg2.outputs.won != 'yes' }}
    uses: ./.github/workflows/recover-batam-leg.yml
    secrets: inherit
    with:
      minutes: ${{ inputs.minutes_per_leg || '350' }}

  leg4:
    needs: leg3
    if: ${{ !cancelled() && needs.leg3.outputs.won != 'yes' }}
    uses: ./.github/workflows/recover-batam-leg.yml
    secrets: inherit
    with:
      minutes: ${{ inputs.minutes_per_leg || '350' }}

# ---------------------------------------------------------------------------
# WHEN THE SERVER IS BACK
#   1. Delete the OCI_* repository secrets.
#   2. Run deployment/oracle/post-recover.sh from the product repo: the public
#      address changed with the old VNIC, and coturn and TURN_URLS still name
#      the old one, so remote video fails for anyone off the shop wifi until
#      they are rewritten. Nothing else looks wrong while that is true.
# ---------------------------------------------------------------------------
